apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: spooltail
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spooltail
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: broker
          image: {{ printf "%s:%s" .Values.image.repository (default .Chart.AppVersion .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: SPOOLTAIL_DATA
              value: /data
            - name: SPOOLTAIL_LISTEN
              value: 0.0.0.0:7474
            - name: SPOOLTAIL_GRPC_LISTEN
              value: 0.0.0.0:7443
            - name: SPOOLTAIL_GRPC_TLS
              value: "off"
          ports:
            - name: http
              containerPort: 7474
            - name: grpc
              containerPort: 7443
          readinessProbe:
            tcpSocket:
              port: grpc
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
