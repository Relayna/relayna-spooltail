apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spooltail
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 7474
      targetPort: http
    - name: grpc
      port: 7443
      targetPort: grpc
