[package]
name = "spooltail"
version = "0.1.0"
edition = "2024"
publish = false
description = "Prototype Rust broker for durable work queues and replayable topics"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
crc32fast = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"
