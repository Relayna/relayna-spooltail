[package]
name = "spooltail"
version = "0.0.1"
edition = "2024"
publish = false
description = "Prototype Rust broker for durable work queues and replayable topics"

[features]
bench-lock-timing = []
bench-transports = ["axum/http2", "tokio-stream/net"]
bench-tls = ["bench-transports", "dep:axum-server"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"], optional = true }
crc32fast = "1"
prost = "0.14"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14.9", features = ["tls-ring"] }
tonic-prost = "0.14.9"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14.9"

[dev-dependencies]
tempfile = "3"
