name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: '1.95.0'

jobs:
  verify:
    name: Verify broker and Python SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --all-features

      - name: Build release broker
        run: cargo build --release --locked

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: true
          cache-dependency-glob: |
            python/uv.lock
            tests/acceptance.py
            tests/grpc_acceptance.py

      - name: Check generated Python gRPC bindings
        run: |
          uv run --project python --locked python python/generate_wire.py
          changes=$(git status --porcelain --untracked-files=all -- python/src/relayna_spooltail/_wire)
          if [[ -n "$changes" ]]; then
            printf 'Generated Python gRPC bindings differ from the checkout.\n%s\n' "$changes"
            exit 1
          fi

      - name: Build Python SDK distributions
        run: uv build --project python

      - name: Run HTTP, SSE, and WebSocket acceptance tests
        run: uv run --python 3.11 --script tests/acceptance.py --events 800000

      - name: Run gRPC acceptance tests
        run: uv run --python 3.13 --script tests/grpc_acceptance.py

      - name: Run Python SDK acceptance tests
        run: uv run --project python --locked --no-editable python tests/python_sdk_acceptance.py
