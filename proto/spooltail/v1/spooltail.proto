syntax = "proto3";
package spooltail.v1;

service Spooltail {
  rpc Ping(Empty) returns (Empty);
  rpc Latest(Task) returns (Record);
  rpc History(Task) returns (Page);
  rpc AuditHistory(AuditHistoryRequest) returns (AuditHistoryPage);
  rpc Append(Publish) returns (Offset);
  rpc Claim(ClaimRequest) returns (ClaimResponse);
  rpc Settle(SettleRequest) returns (Empty);
  rpc Complete(CompleteRequest) returns (Offset);
  rpc Next(StreamGroup) returns (NextResponse);
  rpc Commit(CommitRequest) returns (Empty);
  rpc NextBatch(StreamBatchRequest) returns (StreamBatch);
  rpc CommitBatch(StreamBatchCommit) returns (Empty);
  rpc ReadAfterBatch(TopicReplayRequest) returns (StreamBatch);
  rpc Subscribe(Task) returns (stream Delivery);
  rpc Stats(Empty) returns (StatsResponse);
  rpc ListPartitions(Empty) returns (Partitions);
  rpc EnsurePartition(Partition) returns (Partition);
  rpc TaskPartition(TaskId) returns (Partition);
  rpc MoveTask(MoveTaskRequest) returns (Partition);
}

message Empty {}
message Task {
  string topic = 1;
  string task_id = 2;
  // Exclusive event-ID cursor for History and Subscribe.
  optional string after = 3;
}
message Record {
  // Broker-wide offset and the original journal partition.
  int64 offset = 1;
  bytes event_json = 2;
  uint32 partition = 3;
}
message Page { repeated Record records = 1; }
message AuditHistoryRequest {
  string topic = 1;
  string task_id = 2;
  // Exclusive event ID, resolved across hot and archived history.
  optional string after = 3;
  // Inclusive snapshot bound. Omit to capture the latest retained offset.
  optional int64 through = 4;
  // Requested count, 1 through 64. When omitted, defaults to 32.
  optional uint32 limit = 5;
}
message AuditHistoryPage {
  // A consecutive prefix of the task's records, also limited by response bytes.
  repeated Record records = 1;
  optional int64 through = 2;
}
message Publish {
  string topic = 1;
  bytes event_json = 2;
  // Append placement hint for a new task. An existing task keeps its assignment.
  optional string owner_service = 3;
}
message Offset {
  int64 offset = 1;
  uint32 partition = 2;
}
message ClaimRequest {
  string topic = 1;
  string group = 2;
  int64 lease_ms = 3;
  optional uint32 partition = 4;
}
message ClaimResponse {
  // Absent when no work is available.
  Record record = 1;
  int64 generation = 2;
  int64 lease_until_ms = 3;
  // Current task placement; record.partition identifies the original append.
  uint32 partition = 4;
}
enum SettlementAction {
  SETTLEMENT_ACTION_UNSPECIFIED = 0;
  SETTLEMENT_ACTION_ACK = 1;
  SETTLEMENT_ACTION_RENEW = 2;
  SETTLEMENT_ACTION_RETRY = 3;
  SETTLEMENT_ACTION_DEAD_LETTER = 4;
}
message SettleRequest {
  string topic = 1;
  string group = 2;
  int64 offset = 3;
  int64 generation = 4;
  SettlementAction action = 5;
  int64 delay_ms = 6;
}
message CompleteRequest {
  string topic = 1;
  string group = 2;
  int64 offset = 3;
  int64 generation = 4;
  Publish status = 5;
}
message Delivery {
  // One of ready, status, gap, or error.
  string kind = 1;
  optional string event_id = 2;
  bytes data_json = 3;
}
message StreamGroup {
  string topic = 1;
  string group = 2;
  optional uint32 partition = 3;
}
message NextResponse {
  // Absent when the stream group has caught up.
  Record record = 1;
}
message CommitRequest {
  string topic = 1;
  string group = 2;
  int64 offset = 3;
  optional uint32 partition = 4;
}
message StreamBatchRequest {
  string topic = 1;
  string group = 2;
  optional uint32 partition = 3;
  // Requested record count, 1 through 64. When omitted, defaults to 32.
  optional uint32 limit = 4;
}
message StreamBatch {
  // The exclusive starting offset. NextBatch uses the durable group checkpoint.
  int64 after = 1;
  // A consecutive prefix of eligible records, also limited by response bytes.
  repeated Record records = 2;
}
message TopicReplayRequest {
  string topic = 1;
  // Exclusive offset. Omit it to start from the first retained record.
  optional int64 after = 2;
  // Requested record count, 1 through 64. When omitted, defaults to 32.
  optional uint32 limit = 3;
}
message StreamBatchCommit {
  string topic = 1;
  string group = 2;
  optional uint32 partition = 3;
  // The checkpoint returned by NextBatch.
  int64 after = 4;
  // Offset of the last processed record in the consecutive prefix.
  int64 through = 5;
  uint32 count = 6;
}
message StatsResponse {
  uint64 payload_reads = 1;
  uint64 recovered_frames = 2;
}
message TaskId { string task_id = 1; }
message Partition { uint32 id = 1; }
message Partitions { repeated uint32 ids = 1; }
message MoveTaskRequest {
  string task_id = 1;
  optional uint32 from_partition = 2;
  optional uint32 to_partition = 3;
}
